name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: contextflow
          POSTGRES_PASSWORD: contextflow
          POSTGRES_DB: contextflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contextflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://contextflow:contextflow@localhost:5432/contextflow
      TEST_DATABASE_URL: postgresql+asyncpg://contextflow:contextflow@localhost:5432/contextflow_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret-key
      JWT_SECRET_KEY: ci-jwt-secret-key
      AI_PROVIDER: ollama

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy src/

      - name: Testes com cobertura
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=80
