name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: contextflow
          POSTGRES_PASSWORD: contextflow
          POSTGRES_DB: contextflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contextflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://contextflow:contextflow@localhost:5432/contextflow
      TEST_DATABASE_URL: postgresql+asyncpg://contextflow:contextflow@localhost:5432/contextflow_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret-key
      JWT_SECRET_KEY: ci-jwt-secret-key
      AI_PROVIDER: ollama

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy src/

      - name: Testes com cobertura
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=80

      - name: Atualizar badge de cobertura
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: python scripts/gen_coverage_badge.py

      - name: Commitar badge de cobertura
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.svg
          git diff --staged --quiet || git commit -m "chore: atualiza badge de cobertura [skip ci]"
          git push

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Testes
        run: npm run test

      - name: Build de produção
        run: npm run build
